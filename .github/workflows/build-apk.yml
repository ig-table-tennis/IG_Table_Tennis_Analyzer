name: Construir APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias del sistema
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Preparar Autoconf y Libtool
        run: |
          echo "ACLOCAL_PATH=/usr/share/aclocal" >> "$GITHUB_ENV"
          export ACLOCAL_PATH=/usr/share/aclocal

          aclocal --print-ac-dir
          libtoolize --version
          autoconf --version
          automake --version

      - name: Configurar Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Instalar herramientas Android
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Aceptar licencias Android
        run: |
          yes | sdkmanager --licenses || true

      - name: Instalar Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer

      - name: Limpiar compilación anterior
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Construir APK
        run: |
          export ACLOCAL_PATH=/usr/share/aclocal
          yes | buildozer android debug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: IG-Table-Tennis-Analyzer
          path: bin/*.apk
